version: "3.9"

name: iom-itb-sso-keycloak-ng-prod

services:
  postgres:
    image: postgres:16-alpine
    environment:
      POSTGRES_USER: ${POSTGRES_USER}
      POSTGRES_PASSWORD: ${POSTGRES_PASSWORD}
      POSTGRES_DB: ${POSTGRES_DB:-keycloak}
    volumes:
      - postgres-data-ng:/var/lib/postgresql/data
    restart: unless-stopped
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U ${POSTGRES_USER}"]
      interval: 5s
      timeout: 5s
      retries: 20

  keycloak:
    build:
      context: ./keycloak
      dockerfile: Dockerfile
    command: start --import-realm
    environment:
      KC_DB: postgres
      KC_DB_URL: jdbc:postgresql://postgres:5432/${POSTGRES_DB:-keycloak}
      KC_DB_USERNAME: ${POSTGRES_USER}
      KC_DB_PASSWORD: ${POSTGRES_PASSWORD}
      KEYCLOAK_ADMIN: ${KEYCLOAK_ADMIN}
      KEYCLOAK_ADMIN_PASSWORD: ${KEYCLOAK_ADMIN_PASSWORD}
      KC_PROXY_HEADERS: ${KC_PROXY_HEADERS:-xforwarded}
      KC_HOSTNAME: ${KEYCLOAK_PUBLIC_URL}
      KC_HOSTNAME_STRICT: ${KC_HOSTNAME_STRICT:-true}
      KC_HTTP_ENABLED: "true"
      KC_HEALTH_ENABLED: "true"
      KC_LOG_LEVEL: INFO
      # Placeholder di realm-export.json. Hanya terpakai saat realm PERTAMA KALI
      # di-import (DB kosong); pada sso-ng.iom-itb.id realm sudah ada sehingga
      # client ditambahkan lewat Admin Console (lihat README).
      BANKES_PUBLIC_URL: ${BANKES_PUBLIC_URL:-https://bankes.iom-itb.id}
      BANKES_KEYCLOAK_CLIENT_SECRET: ${BANKES_KEYCLOAK_CLIENT_SECRET:-}
      OTA_KEYCLOAK_CLIENT_SECRET: ${OTA_KEYCLOAK_CLIENT_SECRET:-}
      API_ADMIN_KEYCLOAK_CLIENT_SECRET: ${API_ADMIN_KEYCLOAK_CLIENT_SECRET:-}
    depends_on:
      postgres:
        condition: service_healthy
    restart: unless-stopped

volumes:
  postgres-data-ng:
